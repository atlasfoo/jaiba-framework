name: Bump version

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency: release

jobs:
  bump:
    # Guards against re-triggering this workflow on the bump commit it
    # just pushed. Checked against the commit author's resolved GitHub
    # account rather than the commit message: the message format comes
    # from commitizen's default template (unpinned in .cz.toml) and can
    # change, while every commit this job makes is authored as a GitHub
    # App bot (see "Configure bot git identity" below), whose account
    # name always ends in "[bot]".
    if: ${{ !endsWith(github.event.head_commit.author.username, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-commitizen-4.18.1-${{ runner.os }}

      - name: Install commitizen
        run: pip install commitizen==4.18.1

      - name: Get GitHub App user ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure bot git identity
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Bump version
        run: cz --no-raise 21 bump --yes

      - name: Push commit and tags
        run: git push --follow-tags
