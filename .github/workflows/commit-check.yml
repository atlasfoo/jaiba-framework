name: Commit Check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  commit-check:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install commitizen
        run: |
          uv tool install commitizen==4.18.1
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Check commit messages
        run: cz check --rev-range origin/master..HEAD

      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cz check --message "$PR_TITLE"
